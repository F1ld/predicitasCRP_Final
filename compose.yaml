# Entrada local oficial. IA separada; seed manual.
name: predicitas-crp

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://predicitas_app:${APP_DB_PASSWORD:-predicitas_app_dev}@db:5432/predicitas
  SECRET_KEY: ${SECRET_KEY:-solo-desarrollo-local-cambiar-esta-clave-0123456789}
  ENVIRONMENT: docker
  CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:5173,http://127.0.0.1:5173}

x-admin-env: &admin-env
  <<: *backend-env
  DATABASE_URL_MIGRACIONES: postgresql+psycopg://predicitas_owner:${POSTGRES_PASSWORD:-predicitas_owner_dev}@db:5432/predicitas

services:
  db:
    image: postgres:16
    container_name: predicitas-db
    environment:
      POSTGRES_USER: predicitas_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-predicitas_owner_dev}
      POSTGRES_DB: predicitas
      APP_DB_USER: predicitas_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-predicitas_app_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/backend/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PUERTO_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predicitas_owner -d predicitas"]
      interval: 5s
      timeout: 5s
      retries: 10

  migraciones:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: predicitas-migraciones
    command: ["alembic", "upgrade", "head"]
    environment: *admin-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Solo bajo solicitud explícita. No usar sobre la BD existente en esta fase.
  seed:
    profiles: ["seed-manual"]
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: predicitas-seed
    command:
      - sh
      - -ec
      - 'exec python -m scripts.seed --csv /seed/input.csv --sha256 "$${SEED_CSV_SHA256:?Definir hash del CSV explícito}" --confirmar-bd "$${SEED_CONFIRMAR_BD:?Confirmar nombre de BD destino}"'
    environment:
      <<: *backend-env
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      SEED_CSV_SHA256: ${SEED_CSV_SHA256:-}
      SEED_CONFIRMAR_BD: ${SEED_CONFIRMAR_BD:-}
    volumes:
      # Sin CSV generado por defecto: solo se utiliza al invocar el perfil manual.
      - type: bind
        source: ${SEED_CSV_PATH:-./runtime/imports/seed-no-configurado.csv}
        target: /seed/input.csv
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migraciones:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: predicitas-backend
    environment:
      <<: *backend-env
      IA_URL: http://ia:8100
      IA_API_KEY: ${IA_API_KEY:?Definir IA_API_KEY en el entorno local}
    networks: [default, inferencia]
    depends_on:
      db:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ia:
    build:
      context: ./apps/ia
      additional_contexts:
        contracts: ./contracts
    environment:
      IA_API_KEY: ${IA_API_KEY:?Definir IA_API_KEY en el entorno local}
    networks: [inferencia]
    volumes:
      - type: bind
        source: ${IA_MODEL_DIR:-./artifacts/models/legacy-import}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: predicitas-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "5173:5173"

networks:
  inferencia:
    internal: true

volumes:
  pgdata:
    # Fail-closed: adoptar un volumen conocido, nunca crear uno vacío por la mudanza.
    external: true
    name: ${PGDATA_VOLUME_NAME:-predicitas-crp_pgdata}
