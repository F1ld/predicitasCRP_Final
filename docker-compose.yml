# PrediCitas CRP · Orquestación Docker Compose del Stack Completo
# Servicios: db (PostgreSQL 16) + migraciones (Alembic) + seed (Poblado Oficial) + backend (FastAPI/LightGBM) + frontend (React/Vite)
name: predicitas-crp

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://predicitas_app:${APP_DB_PASSWORD:-predicitas_app_dev}@db:5432/predicitas
  DATABASE_URL_MIGRACIONES: postgresql+psycopg://predicitas_owner:${POSTGRES_PASSWORD:-predicitas_owner_dev}@db:5432/predicitas
  SECRET_KEY: ${SECRET_KEY:-solo-desarrollo-local-cambiar-esta-clave-0123456789}
  ENVIRONMENT: docker
  CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:5173,http://127.0.0.1:5173}

services:
  db:
    image: postgres:16
    container_name: predicitas-db
    environment:
      POSTGRES_USER: predicitas_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-predicitas_owner_dev}
      POSTGRES_DB: predicitas
      APP_DB_USER: predicitas_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-predicitas_app_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend-predicitas/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PUERTO_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predicitas_owner -d predicitas"]
      interval: 5s
      timeout: 5s
      retries: 10

  migraciones:
    build:
      context: ./backend-predicitas
      dockerfile: Dockerfile
    container_name: predicitas-migraciones
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: ./backend-predicitas
      dockerfile: Dockerfile
    container_name: predicitas-seed
    command: ["python", "-m", "scripts.seed", "--password", "DemoCRP2026!"]
    environment: *backend-env
    depends_on:
      migraciones:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build:
      context: ./backend-predicitas
      dockerfile: Dockerfile
    container_name: predicitas-backend
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend-predicitas
      dockerfile: Dockerfile
    container_name: predicitas-frontend
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:

